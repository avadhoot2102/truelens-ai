<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrueLens AI – Free AI Image Detector & Real Image Checker</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #020617, #020617, #020617);
      color: white;
    }

    .center-wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 380px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 0 30px rgba(34,211,238,0.25);
      border: 1px solid rgba(34,211,238,0.2);
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #22d3ee;
      margin-bottom: 5px;
    }

    .tagline {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px;
      background: #020617;
      border: 1px dashed #22d3ee;
      border-radius: 10px;
      color: white;
      cursor: pointer;
    }

    #preview {
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
      display: none;
      box-shadow: 0 0 15px rgba(34,211,238,0.3);
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #22d3ee, #38bdf8);
      color: #020617;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 0 15px rgba(34,211,238,0.6);
    }

    #loader {
      margin-top: 15px;
      display: none;
      color: #22d3ee;
    }

    #result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      min-height: 40px;
      font-size: 1.1rem;
      transition: 0.3s;
    }

    .glow-green { box-shadow: 0 0 15px rgba(34,197,94,0.6); }
    .glow-red { box-shadow: 0 0 15px rgba(239,68,68,0.6); }
    .glow-yellow { box-shadow: 0 0 15px rgba(250,204,21,0.6); }

    .footer {
      margin-top: 15px;
      font-size: 0.7rem;
      color: #64748b;
    }
  </style>
</head>
<title>TrueLens AI – Free AI Image Detector & Real Image Checker</title>

<meta name="description" content="TrueLens AI is a free AI image detector that checks whether an image is AI-generated or real using machine learning." />

<meta name="keywords" content="AI image detector, free AI image detector, real vs AI image checker, AI generated image detection, image authenticity checker" />


<body>

  <div class="center-wrapper">
    <div class="card">

      <h1>TrueLens AI</h1>
      <div class="tagline">AI Image Authenticity Checker</div>

      <input type="file" id="file-input" accept="image/*" />
      <img id="preview" />

      <button id="check-btn">🔍 Check Image</button>

      <div id="loader">⏳ Analyzing image...</div>
      <div id="result"></div>

      <div class="footer">Built by Avadhoot • AI Powered • Made in India 🇮🇳</div>

    </div>
  </div>

  <!-- SEO keywords -->
  <div style="display:none">
    AI image detector, free AI image detector, real vs AI image checker,
    AI generated image detection, image authenticity checker, AI photo detector
  </div>

<script>
  const fileInput = document.getElementById("file-input");
  const preview = document.getElementById("preview");
  const resultText = document.getElementById("result");
  const loader = document.getElementById("loader");
  const checkBtn = document.getElementById("check-btn");

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
    }
  });

  checkBtn.addEventListener("click", async () => {
    if (!fileInput.files.length) {
      resultText.textContent = "⚠️ Please upload an image first";
      return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    loader.style.display = "block";
    resultText.textContent = "";
    checkBtn.disabled = true;

    try {
      const response = await fetch("http://127.0.0.1:8000/detect", {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      loader.style.display = "none";
      checkBtn.disabled = false;

      // 🧠 SAFE GUARD
      if (!data || !data.result) {
        resultText.textContent = "❌ Invalid response from server";
        return;
      }

      // 🎨 COLOR LOGIC
      let color = "#22c55e";       // green = REAL
      let glowClass = "glow-green";

      if (data.result.includes("AI Generated")) {
        color = "#ef4444";
        glowClass = "glow-red";
      } else if (data.result.includes("Uncertain")) {
        color = "#facc15";
        glowClass = "glow-yellow";
      }

      resultText.className = glowClass;
      resultText.innerHTML = `
        <div style="color:${color}; font-size:1.3rem; font-weight:bold;">
          ${data.result}
        </div>
        <div style="color:#94a3b8; font-size:0.9rem;">
          Confidence: ${data.confidence}
        </div>
      `;

    } catch (err) {
      loader.style.display = "none";
      checkBtn.disabled = false;
      resultText.textContent = "❌ Server not responding";
      console.error(err);
    }
  });
</script>

</body>
</html>
